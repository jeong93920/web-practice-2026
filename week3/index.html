<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주대학교 문의하기</title>
  <meta name="description" content="제주대학교 홈페이지 문의하기 페이지입니다.">
  <meta property="og:title" content="제주대학교 문의하기">
  <meta property="og:description" content="제주대학교 홈페이지 문의하기 페이지입니다.">
  <meta property="og:url" content="https://example.com/week3/index.html">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="제주대학교 로고" width="120">
    <h1>정진수</h1>
  </header>

  <main>
    <section>
      <h2>문의하기</h2>
      <form action="#" method="post">
        <p>
          <label for="name">이름</label>
          <input type="text" id="name" name="name" required>
        </p>
        <p>
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" required>
        </p>
        <p>
          <label for="inquiry-type">문의유형</label>
          <select id="inquiry-type" name="inquiry-type">
            <option value="admission">입학 문의</option>
            <option value="academic">학사 문의</option>
            <option value="scholarship">장학금 문의</option>
            <option value="etc">기타 문의</option>
          </select>
        </p>
        <p>
          <label for="content">문의내용</label>
          <textarea id="content" name="content" rows="6" required></textarea>
        </p>
        <p>
          <button type="submit">보내기</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Jeju National University. All rights reserved.</p>
    <p>이메일: ipad93920@gmail.com</p>
  </footer>
</body>
</html>
